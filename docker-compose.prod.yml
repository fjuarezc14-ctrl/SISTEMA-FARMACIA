# =============================================================
# VALETEC PHARMA - ORQUESTACIÓN DOCKER PARA PRODUCCIÓN (GO-LIVE)
# =============================================================
# Configuración endurecida con políticas de reinicio 'always',
# límites estrictos de memoria RAM/CPU, aislamiento de red y SSL.

services:
  # -------------------------------------------------------------
  # 1. BASE DE DATOS TRANSACCIONAL (POSTGRESQL 16 ENTERPRISE)
  # -------------------------------------------------------------
  valetec-db:
    image: postgres:16-alpine
    container_name: valetec_pharma_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: ${PGUSER:-valetec_user}
      POSTGRES_PASSWORD: ${PGPASSWORD:-valetec_secure_password_2026}
      POSTGRES_DB: ${PGDATABASE:-valetec_pharma}
    volumes:
      - valetec_postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-valetec_user} -d ${PGDATABASE:-valetec_pharma}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1024M
        reservations:
          memory: 256M
    networks:
      - valetec_prod_network

  # -------------------------------------------------------------
  # 2. CAPA DE BACKEND (NODE.JS EXPRESS API & UBL 2.1 SUNAT)
  # -------------------------------------------------------------
  valetec-backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: valetec_pharma_backend_prod
    restart: always
    environment:
      PORT: 4000
      NODE_ENV: production
      DB_CLIENT: postgres
      PGHOST: valetec-db
      PGPORT: 5432
      PGUSER: ${PGUSER:-valetec_user}
      PGPASSWORD: ${PGPASSWORD:-valetec_secure_password_2026}
      PGDATABASE: ${PGDATABASE:-valetec_pharma}
      JWT_SECRET: ${JWT_SECRET:-valetec_pharma_production_secret_key_2026}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      SUNAT_ENV: ${SUNAT_ENV:-beta}
      SUNAT_USER: ${SUNAT_USER:-20601234567MODDATOS}
      SUNAT_PASS: ${SUNAT_PASS:-moddatos}
      CERT_PFX_PATH: ${CERT_PFX_PATH:-./certs/certificate_demo.pfx}
      CERT_PASSWORD: ${CERT_PASSWORD:-demo_password_2026}
      POS_WEBHOOK_SECRET: ${POS_WEBHOOK_SECRET:-valetec_pos_webhook_secret_key_2026_xyz}
    depends_on:
      valetec-db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          memory: 128M
    networks:
      - valetec_prod_network

  # -------------------------------------------------------------
  # 3. CAPA DE FRONTEND (NGINX CLOUD HTTP/2 & SSL LET'S ENCRYPT)
  # -------------------------------------------------------------
  valetec-frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: valetec_pharma_frontend_prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./client:/usr/share/nginx/html:ro
      - ./nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - valetec-backend
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          memory: 64M
    networks:
      - valetec_prod_network

# -------------------------------------------------------------
# VOLÚMENES PERSISTENTES Y REDES DE PRODUCCIÓN
# -------------------------------------------------------------
volumes:
  valetec_postgres_prod_data:
    driver: local

networks:
  valetec_prod_network:
    driver: bridge
