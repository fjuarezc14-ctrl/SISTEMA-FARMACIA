services:
  # 1. CAPA DE BASE DE DATOS (POSTGRESQL 16)
  valetec-db:
    image: postgres:16-alpine
    container_name: valetec_pharma_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: valetec_user
      POSTGRES_PASSWORD: valetec_secure_password_2026
      POSTGRES_DB: valetec_pharma
    ports:
      - "${BD_PUERTO:-5442}:5432"
    volumes:
      - valetec_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U valetec_user -d valetec_pharma"]
      interval: 3s
      timeout: 3s
      retries: 5

  # 2. CAPA DE BACKEND (NODE.JS & EXPRESS REST API)
  valetec-backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: valetec_pharma_backend
    restart: unless-stopped
    ports:
      - "${PUERTO:-4030}:4000"
    environment:
      PORT: 4000
      NODE_ENV: production
      DB_CLIENT: postgres
      PGHOST: valetec-db
      PGPORT: 5432
      PGUSER: valetec_user
      PGPASSWORD: valetec_secure_password_2026
      PGDATABASE: valetec_pharma
      JWT_SECRET: valetec_pharma_production_secret_key_2026
      CORS_ORIGIN: "*"
    depends_on:
      valetec-db:
        condition: service_healthy
    volumes:
      - ./server/src:/app/src

  # 3. CAPA DE FRONTEND (CLIENTE WEB SEPARADO EN PUERTO 3000)
  valetec-frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: valetec_pharma_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PUERTO:-5186}:80"
    volumes:
      - ./client:/usr/share/nginx/html
    depends_on:
      - valetec-backend

volumes:
  valetec_postgres_data:
    driver: local
