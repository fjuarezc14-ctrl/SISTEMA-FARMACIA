# =============================================================
# VALETEC PHARMA - CONFIGURACIÓN NGINX PARA PRODUCCIÓN (HTTPS/SSL)
# =============================================================
# Diseñado para entornos Cloud con cifrado SSL/TLS (Let's Encrypt),
# compresión Gzip, cabeceras de endurecimiento HSTS y proxy inverso.

# 1. SERVIDOR HTTP (PUERTO 80) - REDIRECCIÓN Y DESAFÍO ACME CERTBOT
server {
    listen 80;
    listen [::]:80;
    server_name localhost valetec.pe www.valetec.pe;

    # Ruta pública para renovación automatizada de certificados Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Redirección permanente y forzosa hacia HTTPS seguro
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. SERVIDOR HTTPS (PUERTO 443) - ENTORNO SEGURO DE PRODUCCIÓN
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name localhost valetec.pe www.valetec.pe;

    root /usr/share/nginx/html;
    index index.html;

    # Certificados SSL/TLS (Let's Encrypt o Certificado Corporativo)
    ssl_certificate /etc/letsencrypt/live/valetec.pe/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/valetec.pe/privkey.pem;

    # Protocolos seguros y suites de cifrado modernas (A+ SSL Labs)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';

    # Optimización de sesiones SSL
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Cabeceras estrictas de seguridad (Security Hardening)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Compresión Gzip para alto rendimiento en conexiones móviles
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Proxy inverso seguro hacia la API de Node.js en Docker
    location /api/ {
        proxy_pass http://valetec-backend:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Tiempos de espera para transacciones de cobro y facturación
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Caché optimizada para activos estáticos inmutables
    location ~* \.(?:css|js|woff2?|eot|ttf|otf|ico|png|jpg|jpeg|svg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Enrutamiento SPA (Single Page Application)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Manejo de páginas de error de servidor
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
